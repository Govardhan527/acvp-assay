[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "acvp-assay"
version = "0.3.0"
description = "Run NIST ACVP vectors against any implementation and catch conformance regressions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Govardhan Yadava", email = "yadav.govardhan@hotmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
]
keywords = ["acvp", "cavp", "fips-140-3", "cryptography", "test-vectors", "conformance"]
dependencies = [
  "cryptography>=50.0.1,<51",
]

[project.optional-dependencies]
dev = [
  "build>=1.6.0,<2",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.16.5,<0.17",
]

[project.scripts]
acvp-assay = "acvp_assay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acvp_assay"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=acvp_assay",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]

[tool.coverage.run]
branch = true
source = ["acvp_assay"]
